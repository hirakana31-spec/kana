<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>うちの子プロフィール</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f4f2;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        sans-serif;
}

/* 全体 */
.container {
    max-width: 900px;
    margin: auto;
    padding: 45px 20px 70px;
}

/* 上の小さい文字 */
.label {
    font-size: 12px;
    letter-spacing: 3px;
    color: #888;
    margin-bottom: 12px;
}

/* 名前 */
h1 {
    font-size: 46px;
    font-weight: 600;
    letter-spacing: 2px;
    margin: 0 0 10px;
}

.subtitle {
    color: #777;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 40px;
}

/* メイン写真 */
.main-photo {
    width: 100%;
    height: 430px;
    object-fit: cover;
    display: block;
    background: #ddd;
}

/* プロフィール */
.profile {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    margin: 45px 0;
    border-top: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
    padding: 25px 0;
}

.profile-item {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #ddd;
    padding: 12px 0;
}

.profile-item span:first-child {
    color: #888;
    font-size: 13px;
}

.profile-item span:last-child {
    font-size: 14px;
}

/* 見出し */
.section-title {
    font-size: 13px;
    letter-spacing: 3px;
    color: #777;
    margin-bottom: 20px;
}

/* 写真ギャラリー */
.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.gallery img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    display: block;
    background: #ddd;
    transition: opacity 0.3s;
}

.gallery img:hover {
    opacity: 0.8;
}

/* 好きなもの */
.favorites {
    margin-top: 50px;
    padding: 30px 0;
    border-top: 1px solid #ccc;
}

.favorite-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.favorite-list span {
    border: 1px solid #bbb;
    padding: 9px 15px;
    font-size: 13px;
}

/* メッセージ */
.message {
    margin-top: 50px;
    padding: 35px;
    background: #222;
    color: white;
}

.message-title {
    font-size: 12px;
    letter-spacing: 3px;
    color: #aaa;
    margin-bottom: 15px;
}

.message p {
    line-height: 2;
    font-size: 14px;
    margin: 0;
}

/* フッター */
footer {
    text-align: center;
    margin-top: 50px;
    color: #999;
    font-size: 11px;
    letter-spacing: 2px;
}


/* スマホ */
@media (max-width: 600px) {

    .container {
        padding: 30px 16px 50px;
    }

    h1 {
        font-size: 36px;
    }

    .main-photo {
        height: 330px;
    }

    .profile {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .gallery {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .gallery img {
        height: 190px;
    }

    .message {
        padding: 25px;
    }
}
</style>
</head>


<body>

<div class="container">

    <div class="label">MY PET PROFILE</div>

    <h1>〇〇</h1>

    <div class="subtitle">
        MY FAVORITE LITTLE ONE
    </div>


    <!-- メイン写真 -->
    <img
        class="main-photo"
        src="https://placehold.co/900x600"
        alt="ペットの写真"
    >


    <!-- プロフィール -->
    <div class="profile">

        <div class="profile-item">
            <span>NAME</span>
            <span>丸</span>
        </div>

        <div class="profile-item">
            <span>BIRTHDAY</span>
            <span>2025.10.03</span>
        </div>
      
        <div class="profile-item">
            <span>GENDER</span>
            <span>オス</span>
        </div>

        <div class="profile-item">
            <span>PERSONALITY</span>
            <span>やんちゃ</span>
        </div>

        <div class="profile-item">
            <span>FAVORITE</span>
            <span>ご飯とおもちゃ</span>
        </div>

    </div>


    <!-- 写真 -->
    <div class="section-title">
        PHOTO GALLERY
    </div>

    <div class="gallery">

        <img src="https://placehold.co/600x600" alt="写真1">

        <img src="https://placehold.co/600x600" alt="写真2">

        <img src="https://placehold.co/600x600" alt="写真3">

        <img src="https://placehold.co/600x600" alt="写真4">

        <img src="https://placehold.co/600x600" alt="写真5">

        <img src="https://placehold.co/600x600" alt="写真6">

    </div>


    <!-- 好きなもの -->
    <div class="favorites">

        <div class="section-title">
            FAVORITES
        </div>

        <div class="favorite-list">
            <span>おやつ</span>
            <span>おもちゃ</span>
            <span>お昼寝</span>
            <span>お散歩</span>
        </div>

    </div>


    <!-- メッセージ -->
    <div class="message">

        <div class="message-title">
            MESSAGE
        </div>

        <p>
            これからもずっと元気に、<br>
            一緒にたくさんの思い出を作ろう。
        </p>

    </div>


    <footer>
        MY PET PROFILE
    </footer>

</div>

</body>
</html>
